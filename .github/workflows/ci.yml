name: ChainSentinel CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ./backend pytest

      - name: Run Backend Pytest Suite
        run: |
          pytest backend/tests/ -v

      - name: Verify Evaluation Benchmark Integrity
        run: |
          python -m chainsentinel.cli report --eval-ground-truth data/synthetic/ground_truth.json --output-dir /tmp/eval_ci

  frontend-test:
    name: Frontend Test & Build (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm run test

      - name: Verify Zero Fallback Policy
        run: |
          python scripts/check_no_fallback.py

      - name: Production Bundle Build
        working-directory: frontend
        run: npm run build
